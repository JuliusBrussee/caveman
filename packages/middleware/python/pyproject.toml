[build-system]
requires = ["setuptools>=77.0.3,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "caveman-middleware"
version = "1.0.0"
description = "Native framework adapters for the Caveman compression runtime."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["caveman-sdk>=1.2,<2"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://docs.caveman.so/docs/sdk/middleware/python"
Repository = "https://github.com/JuliusBrussee/caveman"
Issues = "https://github.com/JuliusBrussee/caveman/issues"

# One extra per adapter family, each naming only the framework the adapter
# imports, plus security floors where needed. Provider SDKs (openai, anthropic, google-genai) are deliberately
# absent: pinning them here made extras mutually unsatisfiable - `openai==3.10.0`
# under [mcp] against `openai==2.54.0` under [agno] - so no two families could be
# installed together. The framework's own dependency ranges pick the provider.
[project.optional-dependencies]
openai = ["openai>=2.20,<4"]
anthropic = ["anthropic>=1.0,<3"]
google = ["google-genai>=2.18,<3"]
langchain = ["langchain>=1.1,<2", "langchain-core>=1.1,<2", "langgraph>=1.0.2,<2"]
# filelock <=4.2.0 has lock-file and timeout vulnerabilities. Keep the floor in
# wheel metadata so fresh installs backtrack to a compatible LiteLLM release.
# 1.106.0-1.106.2 break base SDK tool calls (BerriAI/litellm#45961).
# 1.107.0 was compromised: https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain
litellm = ["litellm>=1.95,<2,!=1.106.0,!=1.106.1,!=1.106.2,!=1.107.0", "filelock>=4.2.1"]
strands = ["strands-agents>=1.43,<2"]
agno = ["agno>=3.0,<4"]
asgi = []  # pure ASGI 3: no framework dependency
mcp = ["mcp>=2.0,<3"]
crewai = ["crewai>=1.15.3,<2"]
pydantic-ai = ["pydantic-ai-slim>=2.36,<3"]
autogen = ["autogen-agentchat>=0.7,<0.8", "autogen-core>=0.7,<0.8", "autogen-ext>=0.7,<0.8"]
llama-index = ["llama-index-core>=0.14.5,<0.15"]

[tool.setuptools]
packages = ["caveman_middleware"]

[tool.setuptools.package-data]
caveman_middleware = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
