description = "Drop the always-on caveman activation rule into the current repo for every IDE agent"
prompt = "Write the per-repo caveman rule files into the current repo and report the result. If `src/tools/caveman-init.js` exists in the current repo (a caveman checkout), run `node src/tools/caveman-init.js {{args}}`. Otherwise there is no local copy to run: do NOT download the script from a branch and pipe it into node, because that executes whatever is on `main` at call time and defeats an install pinned to a reviewed commit. Tell the user they can run `npx -y github:JuliusBrussee/caveman -- --with-init`, which writes the same rule files from the copy it installs, and say plainly that this command ALSO installs caveman for every agent it detects on the machine, writing user-level config, because --with-init adds the per-repo step rather than replacing the install. Let them decide; do not run it for them. Use --dry-run first if the user did not pass --force, so we never silently overwrite an existing rule file."
