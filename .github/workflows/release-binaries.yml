name: release-binaries

on:
  push:
    tags:
      - "bin-v*"

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: binary-release
    permissions:
      contents: write
      packages: write
      # Keyless cosign signature for the GHCR image (Sigstore, GitHub OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
      - name: Require protected, annotated, verified tag and release pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)"
          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)"
          [[ "$tag_type" == "tag" ]] || { echo "binary release tag must be annotated" >&2; exit 1; }
          verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_ref" --jq .verification.verified)"
          [[ "$verified" == "true" ]] || { echo "binary release tag signature is not GitHub-verified" >&2; exit 1; }
          target="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_ref" --jq .object.sha)"
          git merge-base --is-ancestor "$target" origin/main
          [[ "$(tr -d '\r\n' < packages/cli/BINARY_RELEASE)" == "$GITHUB_REF_NAME" ]] || {
            echo "packages/cli/BINARY_RELEASE does not match $GITHUB_REF_NAME" >&2
            exit 1
          }
      - name: Build deterministic cross-platform artifacts
        run: node scripts/build-release-binaries.mjs --out dist/binaries
      - name: Require complete 36-artifact matrix
        run: |
          set -euo pipefail
          expected="$(node scripts/build-release-binaries.mjs --list | sort)"
          actual="$(find dist/binaries -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' | sort)"
          [[ "$actual" == "$expected" ]] || {
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
            exit 1
          }
      # Platform code signing is optional until the certificates exist. Each
      # step no-ops when its secret is absent; a partial secret set fails.
      - name: Detect optional platform code-signing credentials
        id: codesign
        env:
          APPLE_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          WINDOWS_PFX: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_BASE64 }}
        run: |
          apple=false; windows=false
          [[ -n "$APPLE_P12" ]] && apple=true
          [[ -n "$WINDOWS_PFX" ]] && windows=true
          { echo "apple=$apple"; echo "windows=$windows"; } >> "$GITHUB_OUTPUT"
          echo "macOS signing+notarization: $apple; Windows Authenticode: $windows"
      - name: Authenticode-sign Windows binaries
        if: steps.codesign.outputs.windows == 'true'
        env:
          WINDOWS_PFX: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$WINDOWS_PFX_PASSWORD" ]] || { echo "WINDOWS_AUTHENTICODE_PFX_PASSWORD is missing" >&2; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          keys="$(mktemp -d)"; trap 'rm -rf "$keys"' EXIT
          printf '%s' "$WINDOWS_PFX" | base64 -d > "$keys/cert.pfx"
          printf '%s' "$WINDOWS_PFX_PASSWORD" > "$keys/pass"
          for f in dist/binaries/*_win32_*; do
            osslsigncode sign -pkcs12 "$keys/cert.pfx" -readpass "$keys/pass" -h sha256 \
              -n "Caveman" -i "https://github.com/$GITHUB_REPOSITORY" \
              -ts http://timestamp.digicert.com -in "$f" -out "$f.signed"
            mv "$f.signed" "$f"
          done
      - name: Sign and notarize macOS binaries
        if: steps.codesign.outputs.apple == 'true'
        env:
          APPLE_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_JSON: ${{ secrets.APPLE_NOTARY_API_KEY_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$APPLE_P12_PASSWORD" && -n "$APPLE_NOTARY_API_KEY_JSON" ]] || {
            echo "APPLE_DEVELOPER_ID_P12_PASSWORD and APPLE_NOTARY_API_KEY_JSON are required with the P12" >&2
            exit 1
          }
          # rcodesign (apple-codesign 0.29.0) signs and notarizes from Linux.
          curl -fsSL -o "$RUNNER_TEMP/rcodesign.tgz" \
            https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  $RUNNER_TEMP/rcodesign.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rcodesign.tgz" -C "$RUNNER_TEMP" --strip-components=1 apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign
          keys="$(mktemp -d)"; trap 'rm -rf "$keys"' EXIT
          printf '%s' "$APPLE_P12" | base64 -d > "$keys/cert.p12"
          printf '%s' "$APPLE_P12_PASSWORD" > "$keys/pass"
          printf '%s' "$APPLE_NOTARY_API_KEY_JSON" > "$keys/notary.json"
          for f in dist/binaries/*_darwin_*; do
            "$RUNNER_TEMP/rcodesign" sign --p12-file "$keys/cert.p12" --p12-password-file "$keys/pass" \
              --code-signature-flags runtime "$f"
          done
          # Bare Mach-O files cannot be stapled; Apple's notary accepts them
          # zipped and Gatekeeper then finds the ticket online.
          (cd dist/binaries && zip -q "$RUNNER_TEMP/darwin-notarize.zip" ./*_darwin_*)
          "$RUNNER_TEMP/rcodesign" notary-submit --api-key-file "$keys/notary.json" --wait "$RUNNER_TEMP/darwin-notarize.zip"
      # Code signing rewrites binaries, so their digests are recomputed in the
      # build script's exact format (sorted, two-space separated).
      - name: Recompute checksums after code signing
        if: steps.codesign.outputs.apple == 'true' || steps.codesign.outputs.windows == 'true'
        run: |
          set -euo pipefail
          cd dist/binaries
          node ../../scripts/build-release-binaries.mjs --list | LC_ALL=C sort | xargs sha256sum -- > checksums.txt
      # License texts of every third-party Go module the six binaries link, per
      # platform (build tags differ), plus the Go runtime's. go-licenses is
      # pinned and fails on a module whose license it cannot classify.
      - name: Collect third-party Go module licenses
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-licenses/v2@v2.0.1
          bundle="$RUNNER_TEMP/third-party-go"
          mkdir -p "$bundle/go.dev/go" dist/licenses
          cp "$(go env GOROOT)/LICENSE" "$bundle/go.dev/go/LICENSE"
          # The binaries scripts/build-release-binaries.mjs builds, with its CGO_ENABLED=0.
          packages=(./proxy/cmd/caveman-proxy ./engine/cmd/caveman-engine ./mcp/cmd/caveman-mcp
            ./mem/cmd/cavemem ./browse/cmd/caveman-browse ./shrink/cmd/caveman-shrink)
          for goos in darwin linux windows; do
            for goarch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" "$RUNNER_TEMP/bin/go-licenses" save "${packages[@]}" \
                --ignore github.com/JuliusBrussee/caveman --save_path "$RUNNER_TEMP/go-licenses-$goos-$goarch"
              # -f: go-licenses writes read-only files, and platforms share most of them.
              cp -Rf "$RUNNER_TEMP/go-licenses-$goos-$goarch/." "$bundle/"
            done
          done
          tar -C "$bundle" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - . \
            | gzip -n > dist/licenses/THIRD_PARTY_GO_LICENSES.tar.gz
      # Every binary is Apache-2.0 and embeds MIT pixel/font-licensed code,
      # so the license texts ship with the release and sit in the signed manifest.
      - name: Add license and notice files to the release set
        run: |
          set -euo pipefail
          mkdir -p dist/licenses
          cp LICENSE LICENSE-MIT NOTICE LICENSING.md dist/licenses/
          cp engine/pixel/NOTICE dist/licenses/NOTICE.engine-pixel
          cp engine/pixel/assets/SPLEEN_LICENSE.txt engine/pixel/assets/UNIFONT_LICENSE.txt dist/licenses/
          cp browse/NOTICE dist/licenses/NOTICE.browse
          (cd dist/licenses && sha256sum -- *) >> dist/binaries/checksums.txt
      # The signed manifest names its release: a RELEASE asset holding the tag,
      # listed like any other file. The CLI (pins from bin-v2.0.0) refuses a
      # manifest naming another release, so an older signed manifest cannot be
      # served in this one's place. The signer refuses a manifest without it.
      - name: Name the release in the checksum manifest
        run: |
          set -euo pipefail
          mkdir -p dist/release
          printf '%s\n' "$GITHUB_REF_NAME" > dist/release/RELEASE
          (cd dist/release && sha256sum -- RELEASE) >> dist/binaries/checksums.txt
      - name: Sign checksum manifest with pinned release key
        env:
          CAVEMAN_BINARY_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.CAVEMAN_BINARY_SIGNING_PRIVATE_KEY_PEM }}
        run: >-
          node scripts/sign-binary-checksums.mjs
          dist/binaries/checksums.txt
          dist/binaries/checksums.txt.keysig
          packages/cli/BINARY_SIGNING_PUBKEY.pub
          "$GITHUB_REF_NAME"
      # Before the release is published, so a broken image blocks the release
      # instead of shipping a tag whose container never built. Plain docker
      # commands only: every action here is SHA-pinned and no new SHA can be
      # verified from a release branch.
      - name: Publish caveman-proxy container image to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GHCR rejects any uppercase in a namespace; repository owners may have it.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # No QEMU setup: the Dockerfile's build stage runs on $BUILDPLATFORM and
          # cross-compiles with the Go toolchain, and the final stage has no RUN.
          # BuildKit pinned by digest (buildx's default builder image floats).
          docker buildx create --use \
            --driver-opt image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=true --sbom=true \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" \
            -t "ghcr.io/$owner/caveman-proxy:$GITHUB_REF_NAME" \
            --push .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image-metadata.json")"
          [[ "$digest" == sha256:* ]] || { echo "no pushed image digest in buildx metadata" >&2; exit 1; }
          echo "IMAGE_REF=ghcr.io/$owner/caveman-proxy@$digest" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=ghcr.io/$owner/caveman-proxy:latest" >> "$GITHUB_ENV"
      # Keyless: the certificate names this workflow and tag, and the signature
      # is logged in Rekor. Verify with
      #   cosign verify ghcr.io/<owner>/caveman-proxy:<tag> \
      #     --certificate-identity-regexp '^https://github.com/<owner>/caveman/.github/workflows/release-binaries.yml@refs/tags/bin-v' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # Plain download pinned by digest, matching the no-new-action rule above.
      - name: Sign container image with cosign (keyless)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cosign"
          "$RUNNER_TEMP/cosign" sign --yes "$IMAGE_REF"
      - name: Publish binary-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; refusing overwrite" >&2
            exit 1
          fi
          # --latest=false: the repo's "Latest" badge belongs to the Caveman
          # product release (v*), not to a runtime companion release.
          gh release create "$GITHUB_REF_NAME" dist/binaries/* dist/licenses/* dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --latest=false \
            --title "$GITHUB_REF_NAME" \
            --notes "Signed Caveman runtime companions for macOS, Linux, and Windows. The binaries are licensed under the Apache License 2.0 (LICENSE, NOTICE); see LICENSING.md and the attached third-party notices."
      # Last: `latest` moves only to an image that is signed and whose release
      # exists. Same digest as the version tag; no rebuild. Only a stable tag
      # that is the highest stable bin-v* moves it, so an older-line patch or a
      # prerelease never takes `latest` backwards.
      - name: Point caveman-proxy:latest at the signed image
        run: |
          set -euo pipefail
          stable='^bin-v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$GITHUB_REF_NAME" =~ $stable ]]; then
            echo "$GITHUB_REF_NAME is a prerelease; latest unchanged"
            exit 0
          fi
          highest="$(git tag -l 'bin-v*' --sort=-v:refname | grep -E "$stable" | awk 'NR == 1')"
          if [[ "$highest" != "$GITHUB_REF_NAME" ]]; then
            echo "$highest is newer than $GITHUB_REF_NAME; latest unchanged"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE_LATEST" "$IMAGE_REF"
          got="$(docker buildx imagetools inspect "$IMAGE_LATEST" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$got" == "${IMAGE_REF##*@}" ]] || {
            echo "latest resolves to $got, not the signed ${IMAGE_REF##*@}" >&2
            exit 1
          }
