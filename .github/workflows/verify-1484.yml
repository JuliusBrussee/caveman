name: Verify OpenCode factory isolation

on:
  push:
    branches: [fix/opencode-v1-factory-isolation]
  workflow_dispatch:
    inputs:
      revision:
        description: Untouched baseline revision for broad-suite comparison
        required: false
        type: string

permissions:
  contents: read

env:
  CAVEMAN_TELEMETRY: "0"
  CAVEMAN_TELEMETRY_URL: http://127.0.0.1:9/disabled

jobs:
  targeted:
    if: inputs.revision == ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - run: node --test packages/cli/tests/opencode-factory-isolation.runtime.mjs
      - run: pnpm install --frozen-lockfile --filter "@caveman-ai/cli..."
      - run: pnpm --dir packages/cli lint
      - run: pnpm --dir packages/cli build
      - name: Compiled generator regression
        run: node --test packages/cli/tests/opencode-factory-isolation.runtime.mjs
        env:
          CAVE_OPENCODE_GENERATOR: ../dist/index.js
      - name: Existing native integration
        if: runner.os == 'Linux'
        run: node --import ./packages/cli/tests/fixtures/sanitize-host-env.mjs --test --test-force-exit packages/cli/tests/native-enable.runtime.mjs
      - name: Generated tracked files remain unchanged
        run: git diff --exit-code

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile --filter "@caveman-ai/cli..."
      - run: go build -o "$RUNNER_TEMP/caveman-proxy" ./proxy/cmd/caveman-proxy
      - run: pnpm --dir packages/cli test
        env:
          CAVEMAN_TEST_PROXY_BIN: ${{ runner.temp }}/caveman-proxy
      - name: Reproduce original verification-environment failures on upstream
        if: inputs.revision != ''
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const result = spawnSync(process.execPath, [
            '--test', '--test-force-exit',
            '--test-name-pattern=cloud MCP telemetry carries|namespaced telemetry emits',
            'packages/cli/tests/agent-mcp.runtime.mjs',
            'packages/cli/tests/porcelain.runtime.mjs',
          ], { env: { ...process.env, DO_NOT_TRACK: '1' }, encoding: 'utf8' });
          process.stdout.write(result.stdout);
          process.stderr.write(result.stderr);
          assert.equal(result.status, 1);
          assert.match(result.stdout, /not ok .*cloud MCP telemetry carries/);
          assert.match(result.stdout, /not ok .*namespaced telemetry emits/);
          assert.match(result.stdout, /# fail 2/);
          NODE

  root:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: npm test
      - run: node --test --test-force-exit tests/*.js
        if: ${{ !cancelled() }}
      - run: python -m unittest discover -s tests -p 'test_*.py'
        if: ${{ !cancelled() }}
        env:
          LOCALAPPDATA: ${{ runner.temp }}/caveman-data
      - run: python tests/verify_repo.py
        if: ${{ !cancelled() }}
