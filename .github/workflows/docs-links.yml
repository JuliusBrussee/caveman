name: docs-links

# Package READMEs ship to npm and PyPI, so a dead link there outlives the fix.
# Weekly as well: docs.caveman.so pages can move without a change here.
# Every PR, not only ones that touch the docs: a relative link breaks just as
# well when the file it points at is moved or deleted (~15 seconds).
on:
  pull_request:
  schedule:
    - cron: "5 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: |
          mapfile -t files < <(git ls-files '*README.md' INSTALL.md SECURITY.md LICENSING.md 'docs/technical/*.md' \
            packages/middleware/typescript/CHANGELOG.md packages/middleware/python/CHANGELOG.md)
          node .github/scripts/check-doc-links.mjs "${files[@]}"
