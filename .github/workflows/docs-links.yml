name: docs-links

# Package READMEs ship to npm and PyPI, so a dead link there outlives the fix.
# Weekly as well: docs.caveman.so pages can move without a change here.
on:
  pull_request:
    paths:
      - README.md
      - packages/middleware/*/README.md
      - packages/middleware/*/CHANGELOG.md
      - docs/technical/**
      - .github/scripts/check-doc-links.mjs
      - .github/workflows/docs-links.yml
  schedule:
    - cron: "5 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: >-
          node .github/scripts/check-doc-links.mjs
          README.md
          packages/middleware/typescript/README.md
          packages/middleware/python/README.md
          packages/middleware/typescript/CHANGELOG.md
          packages/middleware/python/CHANGELOG.md
