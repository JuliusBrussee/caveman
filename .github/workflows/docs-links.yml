name: docs-links

# Package READMEs ship to npm and PyPI, so a dead link there outlives the fix.
# Weekly as well: docs.caveman.so pages can move without a change here.
on:
  pull_request:
    paths:
      - "**/README.md"
      - INSTALL.md
      - SECURITY.md
      - LICENSING.md
      - packages/middleware/*/CHANGELOG.md
      - docs/technical/**
      - .github/scripts/check-doc-links.mjs
      - .github/workflows/docs-links.yml
  schedule:
    - cron: "5 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          mapfile -t files < <(git ls-files '*README.md' INSTALL.md SECURITY.md LICENSING.md 'docs/technical/*.md' \
            packages/middleware/typescript/CHANGELOG.md packages/middleware/python/CHANGELOG.md)
          node .github/scripts/check-doc-links.mjs "${files[@]}"
