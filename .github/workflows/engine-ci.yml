name: engine-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One live run per PR (or per branch on push); a newer push supersedes it.
concurrency:
  group: engine-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Every other Go job builds with the runner's default toolchain, which has
  # cgo. The release binaries are built by scripts/build-release-binaries.mjs
  # instead, and while that script used CGO_ENABLED=0 the shipped code
  # compressor parsed Go only, with every test here green (#1020). This lane
  # builds the linux/amd64 release set with the script's own flags (cgo through
  # the pinned zig, static musl), runs the release-shape tests compiled the same
  # way, runs the built engine's embedded evals, and checks the binaries are
  # static. After merge it also cross-builds all six targets, so a Go or zig bump
  # that breaks the darwin or windows link fails here, not at release time.
  release-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Same pin as release-binaries.yml.
      - name: Install pinned zig
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
      - name: Build, test and smoke the linux/amd64 release set
        run: node scripts/build-release-binaries.mjs --test --out "$RUNNER_TEMP/release"
      - name: Linux cgo binaries are static
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/release/caveman-{proxy,engine}_linux_amd64; do
            file "$f" | grep -q 'statically linked' || { file "$f"; echo "$f is not static" >&2; exit 1; }
          done
      - name: Cross-build all six release targets
        if: github.event_name != 'pull_request'
        run: node scripts/build-release-binaries.mjs --out "$RUNNER_TEMP/release-all"

  # The middleware store suite on both backends, and the multi-replica runtime
  # tests, against a real Postgres. Locally they skip unless
  # CAVEMAN_TEST_POSTGRES_URL is set. On main the two packages took 3-6 and
  # 5-8 minutes under -race, one run hit go test's 10-minute default timeout,
  # so each is split by top-level test name across jobs. The names come from
  # `go test -list` at run time and shard.mjs fails unless the shards are
  # exactly that list; subtests run with their parent.
  middleware-postgres:
    name: middleware-postgres / ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: store, shard: 1, shards: 2}
          - {suite: store, shard: 2, shards: 2}
          - {suite: middleware, shard: 1, shards: 3}
          - {suite: middleware, shard: 2, shards: 3}
          - {suite: middleware, shard: 3, shards: 3}
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: caveman
          POSTGRES_PASSWORD: caveman
          POSTGRES_DB: caveman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caveman -d caveman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go test -race, ${{ matrix.suite }} tests shard ${{ matrix.shard }} of ${{ matrix.shards }}
        env:
          CAVEMAN_TEST_POSTGRES_URL: postgres://caveman:caveman@localhost:5432/caveman_test?sslmode=disable
          PACKAGES: ./proxy/internal/${{ matrix.suite }}/...
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          set -euo pipefail
          # -race here too, so the test build below comes from the cache.
          tests="$(go test -race -list '.*' "$PACKAGES" | grep -E '^(Test|Example|Fuzz)' | sort -u \
            | node .github/scripts/shard.mjs "$SHARD" "$SHARDS")"
          go test -count=1 -race -run "^($(paste -sd'|' - <<<"$tests"))\$" "$PACKAGES"

  # Every workspace suite except the ones below, which have jobs of their own:
  # the CLI (sharded), the pi extension, and the SDK and middleware. `pnpm -r
  # test` stops at the first failing package, so a red suite elsewhere cannot
  # skip those either.
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Ubuntu 23.10+ runners restrict unprivileged user namespaces via
      # AppArmor; the agent sandbox tests exercise the real userns sandbox.
      - name: Allow unprivileged user namespaces for sandbox tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The CLI conformance suite needs the real proxy; building it here with
      # the cached Go toolchain keeps the test inside its 90s budget.
      - name: Prebuild caveman-proxy for conformance tests
        run: go build -o "$RUNNER_TEMP/caveman-proxy" ./proxy/cmd/caveman-proxy
      - run: pnpm install --frozen-lockfile
      # The build regenerates the CLI's compiled-in device-auth copy, so check
      # the committed one against packages/device-auth before it does.
      - name: CLI device-auth copy matches packages/device-auth
        run: node packages/cli/scripts/gen-device-auth.mjs --check
      - run: pnpm -r build
      - run: pnpm -r --filter "!@caveman-ai/sdk" --filter "!@caveman-ai/middleware" --filter "!@caveman-ai/cli" --filter "!@caveman-ai/pi" test
        env:
          CAVEMAN_TEST_PROXY_BIN: ${{ runner.temp }}/caveman-proxy
          CAVEMAN_REQUIRE_FRAMEWORKS: "1"

  # The CLI suite (four minutes in one job) split by test file across jobs.
  # Each shard runs the package's own `test` script, minus the build it starts
  # with, on its slice of tests/*.runtime.mjs; shard.mjs fails unless the
  # slices together are exactly that file list.
  typescript-cli:
    name: typescript / cli ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Allow unprivileged user namespaces for sandbox tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prebuild caveman-proxy for conformance tests
        run: go build -o "$RUNNER_TEMP/caveman-proxy" ./proxy/cmd/caveman-proxy
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: CLI tests, shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        working-directory: packages/cli
        env:
          CAVEMAN_TEST_PROXY_BIN: ${{ runner.temp }}/caveman-proxy
          CAVEMAN_REQUIRE_FRAMEWORKS: "1"
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          build="$(node -p 'require("./package.json").scripts.build')"
          suite="$(node -p 'require("./package.json").scripts.test')"
          run="${suite#"$build && "}"
          # The step above already ran the build; what is left must be one
          # node --test over tests/*.runtime.mjs, or this job no longer runs
          # what `pnpm test` runs.
          if [[ "$run" == "$suite" || "$run" == *"&&"* || "$run" != "node "*" tests/*.runtime.mjs" ]]; then
            echo "::error::packages/cli test script is not '<build> && node ... tests/*.runtime.mjs'; update this job: $suite" >&2
            exit 1
          fi
          files="$(printf '%s\n' tests/*.runtime.mjs | node ../../.github/scripts/shard.mjs "$SHARD" "$SHARDS")"
          # shellcheck disable=SC2086 # word-split the command and file list
          pnpm exec ${run% tests/\*.runtime.mjs} $files

  typescript-pi:
    name: typescript / pi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @caveman-ai/pi test

  # The CLI's fast suite on macOS, where most of its users are. test:fast builds
  # the CLI from source and stubs every Go binary, so no Go toolchain, proxy
  # prebuild or workspace build is needed here.
  cli-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @caveman-ai/cli run test:fast

  # Its own job: `pnpm -r test` stops at the first failing package, so a red
  # suite elsewhere in the workspace must not keep these from running.
  middleware-typescript:
    name: middleware-typescript / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @caveman-ai/sdk test
      - run: pnpm --filter @caveman-ai/middleware test
        env:
          CAVEMAN_REQUIRE_FRAMEWORKS: "1"
      - run: pnpm --dir packages/middleware/typescript test:consumer

  # Decides whether a PR runs the Windows suite. Its own job, checkout only, so
  # the Windows jobs start within seconds instead of after root-surfaces' tests.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.windows-scope.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # On a PR, HEAD is GitHub's merge commit and HEAD^1 the base branch tip.
      # Every path counts as relevant unless it is one Windows cannot break
      # (docs, benchmarks, deploy config, prose); so does an unreadable diff.
      # --no-renames lists a rename's source too, not only where it went.
      - name: Does this PR touch Windows-relevant code?
        id: windows-scope
        if: github.event_name == 'pull_request'
        run: |
          if ! changed="$(git diff --no-renames --name-only HEAD^1 HEAD)" \
            || grep -qvE '^(docs|benchmarks|evals|deploy|supabase)/|^[^/]+\.md$|(^|/)(README|CHANGELOG)\.md$' <<<"$changed"; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          fi

  root-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==9.0.3
      - run: npm test
      - run: node --test --test-force-exit tests/*.js
      - run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/caveman-xdg
      - run: python -m pytest -q tests
        working-directory: mem/py
      - run: python tests/verify_repo.py

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run package

  # The whole suite again on Windows. It runs after merge, on manual dispatch,
  # and on PRs that touch Windows-relevant code (the changes job decides), not
  # on every PR push: ci.yml's windows-powershell job keeps the Windows-only
  # hook contract on every PR in under a minute.
  #
  # One job took ~15 minutes, the slowest gate in the repo, so it runs as
  # parallel parts. Every part gets the same toolchain and `pnpm install` the
  # single job had (some Go tests validate against node_modules), and together
  # the parts run every step it ran: go test over every package (sharded;
  # shard.mjs fails unless the shards are exactly `go list ./...`), the root,
  # Python and extension suites, the Windows compatibility gate, and the
  # workspace suites. The `windows` job below is the single verdict.
  windows-suite:
    name: windows / ${{ matrix.part }}${{ matrix.shard && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }}
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.windows == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: go, shard: 1, shards: 2}
          - {part: go, shard: 2, shards: 2}
          - {part: root}
          - {part: compat}
          - {part: workspace}
          - {part: pi}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # Only these parts compile Go; the rest skip the cache restore.
          cache: ${{ contains(fromJSON('["go","compat","workspace"]'), matrix.part) }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile

      - name: go test, shard ${{ matrix.shard }} of ${{ matrix.shards }}
        if: matrix.part == 'go'
        shell: bash
        run: |
          set -euo pipefail
          # The two slowest packages (about 3 minutes each here) go to different shards.
          slow=github.com/JuliusBrussee/caveman/proxy/internal/middleware,github.com/JuliusBrussee/caveman/proxy/internal/store
          packages="$(go list ./... | node .github/scripts/shard.mjs "${{ matrix.shard }}" "${{ matrix.shards }}" --first "$slow")"
          # shellcheck disable=SC2086 # one argument per package
          go test $packages

      - if: matrix.part == 'root'
        run: python -m pip install pytest==9.0.3
      - if: matrix.part == 'root'
        run: npm test
      - if: matrix.part == 'root'
        run: node --test --test-force-exit tests/*.js
      - if: matrix.part == 'root'
        run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          LOCALAPPDATA: ${{ runner.temp }}\caveman-data
      - if: matrix.part == 'root'
        run: python -m pytest -q tests
        working-directory: mem/py
      - if: matrix.part == 'root'
        run: python -m pytest -q
        working-directory: packages/sdk/python
      - if: matrix.part == 'root'
        run: python -m pip install --no-deps -e packages/sdk/python
      - if: matrix.part == 'root'
        run: python -m pip install -c packages/middleware/python/constraints/latest.txt "./packages/middleware/python[langchain,openai]"
      - if: matrix.part == 'root'
        run: python -m pytest -q
        working-directory: packages/middleware/python
        env:
          CAVEMAN_REQUIRED_ADAPTERS: langchain,openai
      - if: matrix.part == 'root'
        run: python tests/verify_repo.py
      - if: matrix.part == 'root'
        run: npm --prefix extension ci
      - if: matrix.part == 'root'
        run: npm --prefix extension test

      - if: matrix.part == 'compat'
        run: npm run test:windows

      - name: Prebuild caveman-proxy for conformance tests
        if: matrix.part == 'workspace'
        run: go build -o "$env:RUNNER_TEMP\caveman-proxy.exe" ./proxy/cmd/caveman-proxy
      - if: matrix.part == 'workspace' || matrix.part == 'pi'
        run: pnpm -r build
      # @caveman-ai/cli's POSIX-harnessed suite has never executed on Windows
      # and is excluded until its harness is ported, not because coverage is
      # unwanted (149 failures — shebang-script stub agent binaries; Windows
      # contracts run in the curated `npm run test:windows` gate above via
      # windows-platform/portable-command/delegate-windows). Every other
      # workspace suite passes on Windows and stays in; the pi extension's
      # runs as its own part.
      - if: matrix.part == 'workspace'
        run: pnpm -r --filter "!@caveman-ai/cli" --filter "!@caveman-ai/pi" test
        env:
          CAVEMAN_TEST_PROXY_BIN: ${{ runner.temp }}\caveman-proxy.exe
          CAVEMAN_REQUIRE_FRAMEWORKS: "1"
      - if: matrix.part == 'workspace'
        run: pnpm --dir packages/middleware/typescript test:consumer
      - if: matrix.part == 'pi'
        run: pnpm --filter @caveman-ai/pi test

  # One verdict for the Windows suite: green when every part passed, or when
  # the PR touched nothing Windows can break and the parts were skipped.
  windows:
    needs: [changes, windows-suite]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Windows part passed (or none had to run)
        env:
          SCOPE: ${{ needs.changes.result }}
          RESULT: ${{ needs.windows-suite.result }}
          WANTED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.windows == 'true' }}
        run: |
          echo "changes=$SCOPE windows-suite=$RESULT windows wanted=$WANTED"
          [[ "$SCOPE" == success ]] || exit 1
          [[ "$RESULT" == success || ( "$WANTED" == false && "$RESULT" == skipped ) ]]
