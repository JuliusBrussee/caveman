name: middleware-python

# The per-framework Python matrix (one pip environment per advertised extra).
# It only proves anything when the Python SDK, the middleware package, or the
# shared parity fixtures change, so it is path-gated instead of riding along
# with engine-ci on every push.
on:
  push:
    branches: [main]
    paths:
      - packages/middleware/python/**
      - packages/sdk/python/**
      - packages/sdk/parity/**
      - .github/workflows/middleware-python.yml
  pull_request:
    paths:
      - packages/middleware/python/**
      - packages/sdk/python/**
      - packages/sdk/parity/**
      - .github/workflows/middleware-python.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: middleware-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/sdk/python
            extras: ""
            required_adapters: ""
          # Each advertised family gets its own environment. Upstream framework
          # constraints can conflict, so a combined install cannot cover them.
          - package: packages/middleware/python
            extras: "[langchain]"
            required_adapters: langchain
          - package: packages/middleware/python
            extras: "[openai]"
            required_adapters: openai
          - package: packages/middleware/python
            extras: "[anthropic]"
            required_adapters: anthropic
          - package: packages/middleware/python
            extras: "[google]"
            required_adapters: google
          - package: packages/middleware/python
            extras: "[litellm]"
            required_adapters: litellm
          - package: packages/middleware/python
            extras: "[strands]"
            required_adapters: strands
          - package: packages/middleware/python
            extras: "[agno]"
            required_adapters: agno
          - package: packages/middleware/python
            extras: "[crewai]"
            required_adapters: crewai
          - package: packages/middleware/python
            extras: "[autogen]"
            required_adapters: autogen
          - package: packages/middleware/python
            extras: "[pydantic-ai]"
            required_adapters: pydantic_ai
          - package: packages/middleware/python
            extras: "[llama-index]"
            required_adapters: llama_index
          - package: packages/middleware/python
            extras: "[asgi]"
            required_adapters: asgi
          - package: packages/middleware/python
            extras: "[mcp]"
            required_adapters: mcp
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      # Test this checkout's SDK contract, not the most recent registry release.
      - run: python -m pip install --no-deps -e packages/sdk/python
      - run: python -m pip install "./${{ matrix.package }}${{ matrix.extras }}"
        if: matrix.extras != ''
      - run: python -m pytest -q
        working-directory: ${{ matrix.package }}
        env:
          CAVEMAN_REQUIRED_ADAPTERS: ${{ matrix.required_adapters }}
