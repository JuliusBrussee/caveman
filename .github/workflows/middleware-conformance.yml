name: middleware-conformance

# The framework middleware against a real caveman-proxy: the black-box protocol
# conformance kit, one certified adapter per language end to end (plus Postgres
# and fail-open), version skew in both directions (plan Decision 10: HEAD
# clients vs the published runtime, published clients vs the HEAD runtime), the
# perf gate, and the Go golden responses validated by ajv (engine-ci's go job
# has no ajv, so that test skips there). Every step runs locally the same way:
# see tests/middleware-e2e/*.mjs.
on:
  push:
    branches: [main]
    paths:
      - proxy/**
      - engine/**
      - shared/**
      - mem/**
      - go.mod
      - go.sum
      - packages/sdk/**
      - packages/middleware/**
      - packages/shared/contracts/**
      - packages/shared/binary-installer/**
      - tests/middleware-e2e/**
      - .github/workflows/middleware-conformance.yml
  pull_request:
    paths:
      - proxy/**
      - engine/**
      - shared/**
      - mem/**
      - go.mod
      - go.sum
      - packages/sdk/**
      - packages/middleware/**
      - packages/shared/contracts/**
      - packages/shared/binary-installer/**
      - tests/middleware-e2e/**
      - .github/workflows/middleware-conformance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: middleware-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  goldens:
    name: go goldens vs contract schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @caveman-ai/contracts
      - run: pnpm --filter @caveman-ai/contracts test
      # The test skips when ajv is missing; here a skip is a failure.
      - name: Go golden responses validated against the schemas
        run: |
          set -euo pipefail
          go test -count=1 -v -run '^TestMiddlewareGoldenResponsesMatchContractSchemas$' ./proxy/internal/middleware | tee "$RUNNER_TEMP/goldens.log"
          grep -q -- '--- PASS: TestMiddlewareGoldenResponsesMatchContractSchemas' "$RUNNER_TEMP/goldens.log"

  e2e:
    name: e2e (sqlite + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: caveman
          POSTGRES_PASSWORD: caveman
          POSTGRES_DB: caveman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caveman -d caveman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile --filter "@caveman-ai/middleware..." --filter @caveman-ai/contracts
      - run: pnpm --filter "@caveman-ai/middleware..." build
      - run: node tests/middleware-e2e/run.mjs
        env:
          CAVEMAN_TEST_POSTGRES_URL: postgres://caveman:caveman@localhost:5432/caveman_test?sslmode=disable

  skew-runtime:
    name: skew / HEAD clients vs published runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile --filter "@caveman-ai/middleware..." --filter @caveman-ai/contracts
      - run: pnpm --filter "@caveman-ai/middleware..." build
      # gh downloads the release asset; skew.mjs verifies its signed checksum manifest and digest.
      - run: node tests/middleware-e2e/skew.mjs runtime
        env:
          GH_TOKEN: ${{ github.token }}

  skew-clients:
    name: skew / published clients vs HEAD runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # caveman-sdk 1.1.0 requires Python 3.13.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: node tests/middleware-e2e/skew.mjs clients

  perf:
    name: perf gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Limits and their derivation: tests/middleware-e2e/perf-thresholds.json.
      - run: node tests/middleware-e2e/perf.mjs
