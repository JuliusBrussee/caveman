name: Verify OpenCode configured paths
on:
  push:
    branches: [fix/opencode-config-path-whitespace]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
      - name: Install build dependencies on runner only
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock --prefix packages/cli
      - name: Build production CLI
        run: npm --prefix packages/cli run build
      - name: Verify all configured-path fixtures
        run: node --import ./packages/cli/tests/fixtures/sanitize-host-env.mjs --test --test-force-exit packages/cli/tests/opencode-config-dir.runtime.mjs
      - name: Verify existing 1441 precedence regressions
        shell: bash
        run: |
          node --import ./packages/cli/tests/fixtures/sanitize-host-env.mjs --test --test-force-exit --test-name-pattern='OPENCODE_CONFIG_DIR' packages/cli/tests/hooks.runtime.mjs
          node --import ./packages/cli/tests/fixtures/sanitize-host-env.mjs --test --test-force-exit --test-name-pattern='OPENCODE_CONFIG_DIR' tests/installer/opencode.test.mjs
      - name: Typecheck CLI
        run: npm --prefix packages/cli run lint
      - name: Full OpenCode installer suite
        run: node --import ./packages/cli/tests/fixtures/sanitize-host-env.mjs --test --test-force-exit tests/installer/opencode.test.mjs tests/installer/opencode-agent.test.mjs
      - name: Full CLI hook suite (POSIX shell fixtures)
        if: runner.os == 'Linux'
        run: node --import ./packages/cli/tests/fixtures/sanitize-host-env.mjs --test --test-force-exit packages/cli/tests/hooks.runtime.mjs
      - name: Diff hygiene
        run: git diff --check
